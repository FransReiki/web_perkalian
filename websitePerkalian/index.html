<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Perkalian</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="Rectangle"> Satria Dan Rainheart </div>
    <!-- HALAMAN UTAMA -->
    <div id="startPage">
        <button onclick="controlPanelPembagianLangsung()">Mulai Pembagian</button>
        <hr>
        <button onclick="controlPanelPerkalian()">Mulai Perkalian</button>
    </div>

    <!-- HALAMAN KUIS -->
    <div id="quizPage" style="display:none;">
        <!-- Tombol di-float ke kanan -->
        <button id="restartButton" onclick="restart()">⟳ Restart</button>

        <!-- Clearfix untuk menghentikan efek float agar elemen di bawahnya rapi -->
        <div class="clearfix"></div>

        <div id="progress"></div>
        <div id="question"></div>

        <input type="number" id="answer">
        <!-- PERBAIKAN: Menambahkan id="nextButton" -->
        <button id="nextButton" onclick="next()">Enter</button>
    </div>

    <!-- HALAMAN HASIL -->
    <div id="resultPage" style="display:none;">
        <h1 id="correct"></h1>
        <h1 id="wrong"></h1>
        <button onclick="restart()">Selesai</button>
        <button onclick="tableResult()">Lihat Tabel Hasil</button>
    </div>

    <!-- HALAMAN TABEL DETAIL -->
    <div id="tableResultPage" style="display:none;">
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Soal</th>
                    <th>Jawaban</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tableQuestion"></tbody>
        </table>

        <button onclick="backToResult()">Kembali</button>
        <button onclick="restart()">Selesai</button>
    </div>

    <script src="main.js"></script>

</body>

</html>
